<div class="bulkbar" hidden>
  <span><b data-selected-count>0</b> selected</span>
  <button class="btn btn-sm" name="bulk" value="approve">{% icon "check" %}Approve</button>
  <button class="btn btn-sm" name="bulk" value="reject" data-confirm="Reject the selected requests? They'll get an e-mail.">{% icon "x" %}Reject</button>
  <button class="btn btn-sm" name="bulk" value="send">{% icon "send" %}E-mail tickets</button>
  {% if bulk_items and not approvals_only %}
  <span class="row nowrap" style="--gap:.3rem">
    <select class="input" name="bulk_item" aria-label="Item" data-item-select style="height:30px;width:auto;background-color:var(--side-2);color:#fff;border-color:#2b3242">{% for i in bulk_items %}<option value="{{ i.pk }}" data-placeholder="{% if i.is_payment_card %}€ {{ i.default_amount|default:0|floatformat:2 }}{% else %}Qty 1{% endif %}">{{ i.name }}</option>{% endfor %}</select>
    <input class="input" name="bulk_value" inputmode="decimal" placeholder="Qty / €" aria-label="Quantity or amount" style="height:30px;width:90px;background:var(--side-2);color:#fff;border-color:#2b3242" />
    <button class="btn btn-sm" name="bulk" value="item">Give item</button>
  </span>
  {% endif %}
  {% if not approvals_only %}
  <button class="btn btn-sm" name="bulk" value="cancel" data-confirm="Cancel the selected accreditations?">Cancel</button>
  <button class="btn btn-sm btn-danger" name="bulk" value="delete" data-confirm="Permanently delete the selected people?">{% icon "trash" %}</button>
  {% endif %}
</div>
