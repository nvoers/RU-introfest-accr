{% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}
<div class="form-grid{% if one %} one{% endif %}">
  {% if form.non_field_errors %}<ul class="errorlist nonfield">{% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
  {% for field in form.visible_fields %}{% include "components/field.html" %}{% endfor %}
</div>
