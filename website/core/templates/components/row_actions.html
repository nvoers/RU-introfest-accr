<button class="btn btn-sm btn-ghost btn-icon" type="button" data-open="dlg-{{ obj.pk }}" title="Edit">{% icon "edit" %}<span class="sr-only">Edit</span></button>
<form method="post" class="inline" data-confirm="Delete “{{ obj }}”?{% if warn %} {{ warn }}{% endif %}">
  {% csrf_token %}<input type="hidden" name="item" value="{{ obj.pk }}" />
  <button class="btn btn-sm btn-ghost btn-icon btn-danger" name="action" value="delete" title="Delete">{% icon "trash" %}<span class="sr-only">Delete</span></button>
</form>
