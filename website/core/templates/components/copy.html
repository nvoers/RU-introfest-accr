<div class="copy">
  <input class="input" id="{{ id }}" value="{{ value }}" readonly onclick="this.select()" />
  <button type="button" class="btn" data-copy="#{{ id }}">{% icon "link" %}Copy</button>
  <a class="btn btn-icon" href="{{ value }}" target="_blank" rel="noopener" title="Open">{% icon "external" %}<span class="sr-only">Open</span></a>
</div>
